[project]
name = "techinsight-backend"
version = "0.1.0"
description = "TechInsight backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.18.5",
    "pgvector>=0.3",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1",
    "openai>=2.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.14.2",
]

[tool.uv]
package = false

# CPU-only torch keeps the backend image lean (no CUDA payload). macOS resolves
# torch from PyPI (CPU build); Linux uses PyTorch's dedicated CPU wheel index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
